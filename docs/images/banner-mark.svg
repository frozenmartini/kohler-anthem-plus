<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-0.5 -22 79 79" fill="none" role="img" aria-label="Kohler Anthem Plus">
  <!-- The v27 mark's real knock-out mask (brand/src/icon-v27.svg), not the white-line
       repaint this file carried until 2026-09-07 (kept as banner-mark-solid.svg). That
       repaint existed because a mask forces the renderer to rasterise, and this file's
       old width/height of 316 — 4x the 79-unit viewBox — wasn't enough headroom to keep
       that bake crisp at the size READMEs display it. Verified 2026-09-07 with
       rsvg-convert: a mask rendered directly at its target resolution is exactly as
       crisp as a plain fill/stroke — the pixelation was a small-raster-then-upscale
       artifact of the old declared size, not something masks do inherently. width/height
       here is 1024 — roughly 13x the viewBox, versus the old 4x — so any consumer that
       bakes a bitmap at this file's "natural size" before scaling has enough resolution
       to stay clean, including at retina widths well past the 150px this is shown at. If
       some renderer still bands, point the <img> tags back at banner-mark-solid.svg. -->
  <defs>
    <mask id="knock-v27" maskUnits="userSpaceOnUse" x="-0.5" y="-22" width="79" height="79">
      <rect x="-0.5" y="-22" width="79" height="79" fill="#FFFFFF"/>
      <g transform="translate(5.6265306,-5.0714286) scale(1.2897959)" stroke-width="3.5">
        <rect x="0.5" y="6.3" width="57.75" height="22.4" rx="4.53579" stroke="#000000"/>
        <ellipse cx="22.25" cy="17.5" rx="15.75" ry="15.3" fill="#FFFFFF"/>
        <ellipse cx="22.25" cy="17.5" rx="15.75" ry="15.3" stroke="#000000"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#knock-v27)">
    <rect x="-0.5" y="-22" width="79" height="79" rx="16" fill="#A35CD6"/>
    <g transform="translate(5.6265306,-5.0714286) scale(1.2897959)">
      <rect x="0.5" y="6.3" width="57.75" height="22.4" rx="4.53579" fill="#9253DB"/>
      <ellipse cx="22.25" cy="17.5" rx="15.75" ry="15.3" fill="#6A3DE8"/>
    </g>
  </g>
</svg>
